services:
  - type: web
    name: cadra-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: cadra-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SITE_URL
        value: https://cadra.ge
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
